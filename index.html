<!DOCTYPE html>
<html lang="ru">
<head>

<title>Beyim Studio: конструктор урока</title>

<!-- Precompiled, purged Tailwind build (tailwind.config.js + tailwind-input.css -> tailwind.css).

     DOM mutation and was the cause of the jank on dense routes like #/results/:id. -->
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-bg text-ink font-sans antialiased">

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Основная навигация"></aside>
    <div id="view-root" class="view-root"></div>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
